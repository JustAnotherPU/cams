# Optional: Home Assistant sends the detections to the RideWatch server instead of (or as well as) Protect's own event
# list (server/events.py). Put this in a package (packages/jap_ridewatch.yaml), set in cams.json on the server
#   "events_from": "<Home Assistant's IP>", "events_token": "<a long random string>"
# and "events_protect": false to stop polling Protect. jap_ridewatch_events_token goes in secrets.yaml.
# The entity ids below are examples from the UniFi Protect integration: use yours. "cam" is the Protect camera's name.
rest_command:
  jap_ridewatch_event:
    url: http://192.0.2.10:18641/event
    method: POST
    timeout: 5
    headers:
      X-Token: !secret jap_ridewatch_events_token
    content_type: application/json
    payload: '{"cam": {{ cam | tojson }}, "type": {{ type | tojson }}}'

automation:
  - id: jap_ridewatch_timeline_push
    alias: "RideWatch: detections to the car"
    mode: queued
    max: 20
    trigger:
      - platform: state
        id: detect
        from: "off"
        to: "on"
        entity_id:
          - binary_sensor.front_door_person_detected
          - binary_sensor.front_door_vehicle_detected
          - binary_sensor.garage_person_detected
          - binary_sensor.garage_animal_detected
      - platform: state
        id: ring
        entity_id: event.front_door_doorbell
        not_from: ["unavailable", "unknown"]
        not_to: ["unavailable", "unknown"]
    action:
      - action: rest_command.jap_ridewatch_event
        continue_on_error: true
        data:
          cam: "{{ device_attr(device_id(trigger.entity_id), 'name') }}"
          type: >-
            {{ 'ring' if trigger.id == 'ring'
               else (trigger.entity_id | regex_findall_index('_(person|vehicle|animal|package)_detected')) }}
